<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Projeto 78 — Treino & Emagrecimento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap');
:root{
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --bg:#0c0c0e; --bg2:#141417; --card:#1a1a1f; --card2:#222229;
  --line:#2b2b33; --txt:#f2f2f4; --mut:#9a9aa6; --dim:#6b6b78;
  --red:#e52a33; --red2:#ff4d55; --redbg:#2a1215;
  --grn:#34c778; --grnbg:#12281c; --yel:#f5b83d; --yelbg:#2a2210;
  --blu:#4da3ff;
  --r:16px; --r2:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;min-height:100vh;overscroll-behavior-y:none}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem}
.hidden{display:none!important}

/* layout */
#view{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 75%,transparent);padding:14px 0 10px}
h1.logo{font-family:var(--disp);font-style:italic;font-size:1.65rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
h1.logo span{color:var(--red)}
.sub{color:var(--mut);font-size:.82rem;margin-top:2px}

/* tabbar */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(18,18,22,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim);font-size:.68rem;font-weight:600}
#tabbar button .ic{line-height:0}
#tabbar button .ic svg{width:22px;height:22px}
#tabbar button.on{color:var(--red2)}

/* cards */
.card{background:linear-gradient(180deg,#1c1c22,#16161b);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:.95rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto}
.tag{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mut);white-space:nowrap}
.tag.red{background:var(--redbg);color:var(--red2)}
.tag.grn{background:var(--grnbg);color:var(--grn)}
.tag.yel{background:var(--yelbg);color:var(--yel)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:var(--r2);font-weight:700;font-size:.95rem;background:var(--red);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--mut)}
.btn.grn{background:var(--grn);color:#06130c}
.btn.sm{padding:9px 14px;width:auto;font-size:.82rem;border-radius:10px}
.btn:disabled{opacity:.4}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:99px;background:var(--card2);border:1.5px solid transparent;font-weight:600;font-size:.88rem;color:var(--mut)}
.chip.on{background:var(--redbg);border-color:var(--red);color:#fff}

/* inputs */
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:var(--r2);padding:13px 14px;color:var(--txt);outline:none}
.field input:focus{border-color:var(--red)}

/* onboarding */
#onb{max-width:560px;margin:0 auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
.onb-dots{display:flex;gap:6px;margin-bottom:26px}
.onb-dots i{height:4px;flex:1;border-radius:99px;background:var(--card2)}
.onb-dots i.on{background:var(--red)}
.onb-title{font-family:var(--disp);font-size:2rem;font-weight:800;letter-spacing:.01em;margin-bottom:8px}
.onb-sub{color:var(--mut);font-size:.92rem;line-height:1.5;margin-bottom:22px}
.onb-body{flex:1}
.onb-nav{display:flex;gap:10px;margin-top:20px}

/* home hero */
.hero{background:linear-gradient(135deg,#1c1114 0%,#17171c 55%);border:1px solid #3a1e22;border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero .big{font-family:var(--disp);font-size:3.2rem;font-weight:800;line-height:1;text-shadow:0 0 36px rgba(229,42,51,.45);font-variant-numeric:tabular-nums}
.hero .big small{font-size:1rem;color:var(--mut);font-weight:600}
.pbar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:12px 0 6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:99px}
.hero .meta{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mut)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wday{background:var(--card2);border-radius:10px;padding:8px 2px;text-align:center;border:1.5px solid transparent}
.wday.today{border-color:var(--red)}
.wday .d{font-size:.62rem;color:var(--dim);font-weight:700;text-transform:uppercase}
.wday .ic{font-size:1.05rem;margin:3px 0 1px}
.wday .l{font-size:.56rem;color:var(--mut);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* stats */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px;text-align:center}
.stat .v{font-family:var(--disp);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:.68rem;color:var(--mut);font-weight:600;margin-top:2px}

/* workout list */
.wk-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;width:100%;text-align:left}
.wk-item .em{font-size:1.6rem}
.wk-item .t{font-weight:700;font-size:.94rem}
.wk-item .s{color:var(--mut);font-size:.78rem;margin-top:2px}
.wk-item .go{margin-left:auto;color:var(--red2);font-weight:800;font-size:1.2rem}

/* session */
.sess-ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sess-ex h4{font-size:.95rem;font-weight:700;color:var(--red2)}
.sess-ex .cue{font-size:.78rem;color:var(--mut);line-height:1.45;margin-top:4px}
.sets{width:100%;border-collapse:collapse;margin-top:10px}
.sets th{font-size:.64rem;color:var(--dim);text-transform:uppercase;font-weight:700;padding:4px 2px;text-align:center}
.sets td{padding:4px 2px;text-align:center}
.sets .sn{font-weight:800;color:var(--mut);font-size:.85rem}
.sets .prev{font-size:.75rem;color:var(--dim)}
.sets input{width:100%;max-width:74px;background:var(--card2);border:1.5px solid var(--line);border-radius:9px;padding:9px 4px;color:var(--txt);text-align:center;font-weight:700;outline:none}
.sets input:focus{border-color:var(--red)}
.sets tr.done input{border-color:var(--grn);background:var(--grnbg);color:var(--grn)}
.ck{width:38px;height:38px;border-radius:10px;background:var(--card2);font-weight:800;color:var(--dim);font-size:1rem}
.ck.on{background:var(--grn);color:#06130c}
.addset{margin-top:8px;width:100%;padding:9px;border-radius:10px;background:var(--card2);color:var(--mut);font-weight:700;font-size:.8rem}

/* timer bar */
#timerbar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:40;background:#241417;border:1px solid var(--red);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#timerbar .tv{font-family:var(--disp);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
#timerbar .tl{font-size:.7rem;color:var(--mut)}

/* session topbar */
.sess-top{position:sticky;top:0;z-index:25;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sess-top .tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem}

/* history */
.hist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hist .hd{display:flex;justify-content:space-between;align-items:center}
.hist .t{font-weight:700;font-size:.92rem}
.hist .d{color:var(--mut);font-size:.75rem;margin-top:2px}
.hist .body{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:.82rem;color:var(--mut);line-height:1.7}
.pr-flag{color:var(--yel);font-weight:700}

/* modal */
#modal-root{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
#modal-root.open{display:flex}
.modal{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;border-top:1px solid var(--line)}
.modal h2{font-size:1.15rem;font-weight:800;margin-bottom:14px}
.m-handle{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}

/* water */
.water{display:flex;gap:6px;margin-top:8px}
.cup{flex:1;height:34px;border-radius:8px;background:var(--card2);border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;font-size:.95rem;color:var(--dim)}
.cup.full{background:#12222e;border-color:var(--blu);color:var(--blu)}

/* chart */
.chartwrap{overflow-x:auto}
svg.chart{display:block;width:100%;height:auto}

/* plan schedule */
.sched{display:flex;flex-direction:column;gap:8px}
.sched .srow{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:var(--r2);padding:11px 13px}
.sched .sd{width:38px;font-weight:800;font-size:.8rem;color:var(--mut)}
.sched .si{font-size:1.15rem}
.sched .st{font-weight:600;font-size:.85rem}
.sched .ss{font-size:.72rem;color:var(--mut);margin-top:1px}
.sched .srow.today2{outline:1.5px solid var(--red)}

.note{font-size:.8rem;color:var(--mut);line-height:1.55}
.note b{color:var(--txt)}
ul.tips{margin:8px 0 0 18px;font-size:.82rem;color:var(--mut);line-height:1.7}
ul.tips b{color:var(--txt)}
.divider{height:1px;background:var(--line);margin:12px 0}
.fade-in{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* aneis de progresso */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.ringwrap{position:relative;width:76px;height:76px;margin:0 auto}
.ringwrap svg{transform:rotate(-90deg);display:block}
.ringval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:1.2rem;line-height:1;font-variant-numeric:tabular-nums}
.ringval small{font-size:.55rem;color:var(--mut);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-weight:600;margin-top:2px}
.ringname{font-size:.64rem;color:var(--mut);font-weight:700;margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.heroring{position:relative;width:88px;height:88px;flex:none}
.heroring svg{transform:rotate(-90deg);display:block}
.heroring .ringval{font-size:1.3rem}

/* coach */
.coach{margin-top:10px;display:flex;align-items:center;gap:8px;background:#0f1a26;border:1px solid #1e3a54;border-radius:10px;padding:9px 11px;font-size:.78rem;color:#aecdf2;line-height:1.4}
.coach b{color:#e3f0ff}
.coach button{margin-left:auto;background:#1e3a54;color:#cfe6ff;border-radius:8px;padding:6px 11px;font-weight:700;font-size:.74rem;white-space:nowrap;flex:none}

/* heatmap de consistencia */
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;justify-content:start;overflow-x:auto;padding-bottom:4px}
.hm i{width:12px;height:12px;border-radius:3px;background:var(--card2)}
.hm i.h2{background:#7c1d24}.hm i.h3{background:var(--red)}

/* conquistas */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{background:var(--card2);border-radius:12px;padding:10px 4px 8px;text-align:center}
.bdg .e{font-size:1.35rem}
.bdg .t{font-size:.58rem;font-weight:700;margin-top:4px;color:var(--mut);line-height:1.2}
.bdg.lock{opacity:.32;filter:grayscale(1)}

/* descanso em tela cheia */
#restfull{position:fixed;inset:0;z-index:60;background:rgba(10,10,13,.97);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#restfull .rl{font-size:.72rem;font-weight:800;letter-spacing:.28em;color:var(--red2);text-transform:uppercase}
#restfull .ringbig{position:relative;width:230px;height:230px}
#restfull .ringbig svg{transform:rotate(-90deg);display:block}
#restfull .ringbig circle{transition:stroke-dashoffset 1s linear}
#restfull .rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:4.2rem;font-weight:800;font-variant-numeric:tabular-nums}
#restfull .ri{font-size:.85rem;color:var(--mut);text-align:center;max-width:300px;line-height:1.5}
#restfull .rbtns{display:flex;gap:10px}
#restfull .min{color:var(--dim);font-size:.8rem;font-weight:600;padding:8px}

/* detalhe do treino */
.dex{display:flex;gap:12px;background:linear-gradient(180deg,#1c1c22,#16161b);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.dex .n{font-family:var(--disp);font-size:1.3rem;font-weight:700;color:var(--dim);width:28px;flex:none;padding-top:2px;font-style:italic}
.dex .t{font-weight:700;font-size:.9rem}
.dex .m2{font-size:.7rem;color:var(--mut);margin-top:1px}
.dex .c2{font-size:.76rem;color:var(--mut);line-height:1.45;margin-top:6px}
.dex .rx{margin-left:auto;text-align:right;flex:none;padding-left:8px}
.dex .rx .sr{font-family:var(--disp);font-size:1.35rem;font-weight:700;color:var(--red2);white-space:nowrap}
.dex .rx .rt2{font-size:.64rem;color:var(--dim);margin-top:2px}

/* dor na canela */
input[type=range].shin{width:100%;accent-color:var(--red);height:34px;margin-top:4px}
.shin-scale{display:flex;justify-content:space-between;font-size:.66rem;color:var(--dim)}
</style>
</head>
<body>

<div id="onb" class="hidden"></div>
<div id="app" class="hidden">
  <main id="view"></main>
  <nav id="tabbar">
    <button data-tab="home" onclick="go('home')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg></span>Início</button>
    <button data-tab="treino" onclick="go('treino')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8v8M4 9.5v5M17 8v8M20 9.5v5M7 12h10"/></svg></span>Treino</button>
    <button data-tab="prog" onclick="go('prog')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M7 21v-8M12 21V5M17 21v-11"/></svg></span>Progresso</button>
    <button data-tab="plano" onclick="go('plano')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4M9 10h6M9 14h6M9 18h3"/></svg></span>Plano</button>
  </nav>
</div>
<div id="timerbar" class="hidden">
  <div onclick="expandRest()" style="cursor:pointer"><div class="tv" id="timer-val">0:00</div><div class="tl">Descanso · toque p/ expandir</div></div>
  <div class="grow" onclick="expandRest()"></div>
  <button class="btn sm ghost" onclick="timerAdd(30)">+30s</button>
  <button class="btn sm" onclick="timerStop()">Pular</button>
</div>
<div id="restfull" class="hidden"></div>
<div id="modal-root" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-box"></div></div>

<script>
'use strict';
/* =============================================================
   Projeto 78 — plataforma pessoal de treino, wellness e emagrecimento
   Dados 100% locais (localStorage). Estilo Hevy, plano gerado por questionário.
   ============================================================= */

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = iso => { const [y,m,d]=iso.split('-'); return d+'/'+m; };
const fmtDateFull = iso => { const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; };
const fmtClock = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const localISO = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const inRange=(iso,a,b)=>{ const d=new Date(iso+'T12:00'); return d>=a&&d<b; };
function weekOf(offset){ const now=new Date(); const day=(now.getDay()+6)%7; const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(mon.getDate()-day-7*offset); const end=new Date(mon); end.setDate(mon.getDate()+7); return [mon,end]; }
function ringSVG(pct,size,stroke,color){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.min(1,Math.max(0,pct)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#26262e" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .9s ease"/></svg>`;
}
function ringBoxHTML(pct,val,name,color,click){
  return `<div ${click?`onclick="${click}" style="cursor:pointer"`:''}>
    <div class="ringwrap">${ringSVG(pct,76,7,color)}<div class="ringval">${val}</div></div>
    <div class="ringname">${name}</div></div>`;
}

// ---------- storage ----------
const KEY='projeto78_v1';
function defState(){ return { profile:null, plan:null, weights:[], waist:[], sessions:[], wellness:{}, activeSession:null }; }
let S = defState();
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(defState(), JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// ---------- banco de exercícios ----------
// variantes por equipamento: gym / home (halteres) / body (peso corporal)
const EXDB = {
  squat:   {gym:'Agachamento Livre (barra)', home:'Agachamento Goblet (halter)', body:'Agachamento + salto controlado', m:'Quadríceps · Glúteo', cue:'Pés na largura dos ombros, desça controlado até a coxa ficar paralela ao chão. Core firme, calcanhar no chão. É a base da força de perna do jogador.'},

// ---------- geração do plano ----------
function tdee(p){
  // Mifflin-St Jeor + fator de atividade (treina + joga bola = ativo)
  const w = currentWeight() || p.weight0;
  const base = p.sex==='F' ? (10*w + 6.25*p.height - 5*p.age - 161) : (10*w + 6.25*p.height - 5*p.age + 5);
  const factor = 1.35 + 0.05*p.daysGym + 0.05*p.soccerDays.length; // ~1.6-1.7 pra rotina cheia
  return Math.round(base * Math.min(factor,1.75));
}
function nutritionTargets(p){
  const t = tdee(p);
  const weeks = Math.max(1, daysBetween(todayISO(), p.goalDate)/7);
  const kg = Math.max(0,(currentWeight()||p.weight0) - p.goalWeight);
  let rate = kg/weeks;                       // kg por semana necessários
  let deficit = Math.round(rate*7700/7);     // kcal/dia
  deficit = Math.min(deficit, Math.round(t*0.25)); // teto saudável: 25% do TDEE
  deficit = Math.max(deficit, 350);
  const w = currentWeight()||p.weight0;
  return { tdee:t, target:t-deficit, deficit, rate:Math.round(rate*100)/100,
           protein:Math.round(w*1.9), water:Math.round(w*35/250)*250 };
}

    exercises:[ W('wallsit',3,'30-45s',45), W('tib',3,'20',30), W('calfB',2,'15 lentas',30), W('soleo',2,'40s /lado',15), W('heelwalk',2,'20m',15) ]};
  return wk;
}
function generatePlan(p){
  const wk = buildWorkouts(p);
  // sequência de treinos de academia conforme dias disponíveis
  const seq = p.daysGym>=5 ? ['legsA','push','legsB','pullw','full']
            : p.daysGym===4 ? ['legsA','push','legsB','pullw']
            : ['legsA','push','legsB'];
  // agenda: futebol nos dias escolhidos; academia distribuída nos demais
  const sched = {}; // 0..6 -> {type, wid?}
  p.soccerDays.forEach(d => sched[d] = {type:'soccer'});
  const free = [1,2,3,4,5,6,0].filter(d => !sched[d]);
  // busca a melhor combinação de dias + ordem dos treinos:
  // perna nunca na véspera do jogo, pernas nunca em dias seguidos, treinos espalhados
  const isLeg = w => w==='legsA'||w==='legsB';
  const circAdj = (a,b) => { const x=Math.abs(a-b); return x===1||x===6; };
  function perms(arr){ if(arr.length<=1) return [arr];
    return arr.flatMap((v,i)=>perms(arr.slice(0,i).concat(arr.slice(i+1))).map(r=>[v].concat(r))); }
  function combos(arr,k){ if(k===0)return[[]]; if(arr.length<k)return[];
    const h=arr[0],t=arr.slice(1);
    return combos(t,k-1).map(c=>[h].concat(c)).concat(combos(t,k)); }
  const k = Math.min(seq.length, free.length);
  let best=null, bestPen=Infinity;
  combos(free,k).forEach(days=>{
    perms(seq).forEach(order=>{
      let pen=0;
      for(let i=0;i<k;i++){ const wid=order[i], d=days[i];
        const nx=(d+1)%7, pv=(d+6)%7;
        if(isLeg(wid)){ if(p.soccerDays.includes(nx)) pen+=4; if(p.soccerDays.includes(pv)) pen+=1; }
        for(let j=i+1;j<k;j++){ if(circAdj(d,days[j])){ pen+=1; if(isLeg(wid)&&isLeg(order[j])) pen+=3; } }
      }
      if(pen<bestPen){ bestPen=pen; best={days,order}; }
    });
  });
  if(best) best.order.slice(0,k).forEach((wid,i)=>{ sched[best.days[i]]={type:'gym',wid}; });
  // cardio Z2 nos dias restantes, sempre preservando pelo menos 1 dia de descanso total
  const leftover = [1,2,3,4,5,6,0].filter(d=>!sched[d]);
  leftover.slice(0, Math.min(2, Math.max(0, leftover.length-1))).forEach(d=> sched[d]={type:'cardio'});
  for(let d=0;d<7;d++) if(!sched[d]) sched[d]={type:'rest'};
  return { schedule:sched, workouts:wk, nutrition:nutritionTargets(p), createdAt:todayISO() };
}

function currentWeight(){ return S.weights.length ? S.weights[S.weights.length-1].kg : (S.profile?S.profile.weight0:null); }
function logWeight(kg){
  const t=todayISO(); const i=S.weights.findIndex(w=>w.date===t);
  if(i>=0) S.weights[i].kg=kg; else S.weights.push({date:t,kg});
  S.weights.sort((a,b)=>a.date<b.date?-1:1);
  if(S.plan&&S.profile) S.plan.nutrition = nutritionTargets(S.profile);
  save();
}

// ---------- análises ----------
function projection(){
  const p=S.profile, ws=S.weights; if(!p||ws.length<2) return null;
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-14);
  const recent=ws.filter(w=>new Date(w.date+'T12:00')>=cutoff);
  const arr=recent.length>=2?recent:ws.slice(-2);
  const a=arr[0], b=arr[arr.length-1];
  const days=Math.max(1,daysBetween(a.date,b.date));
  const rate=(b.kg-a.kg)/days; // kg/dia
  if(rate>=-0.005) return {rate,eta:null};
  const d=Math.round((b.kg-p.goalWeight)/(-rate));
  if(d<0||d>400) return {rate,eta:null};
  const dt=new Date(); dt.setDate(dt.getDate()+d);
  return {rate, eta:localISO(dt)};
}
function statsBetween(a,b){
  const ss=S.sessions.filter(s=>inRange(s.date,a,b));
  const ww=S.weights.filter(w=>inRange(w.date,a,b));
  return { count:ss.length, vol:ss.reduce((t,s)=>t+(s.volume||0),0),
    w: ww.length? ww.reduce((t,x)=>t+x.kg,0)/ww.length : null };
}
function achievements(){
  const p=S.profile;
  const gym=S.sessions.filter(s=>s.type!=='cardio');
  const shin=gym.filter(s=>s.workoutId==='shin').length;
  const soccer=S.sessions.filter(s=>s.workoutId==='soccer').length;
  const lost=p.weight0-currentWeight();
  const maxVol=S.sessions.reduce((m,s)=>Math.max(m,s.volume||0),0);
  const perfect=weekStats().count>=p.daysGym;
  return [
    {e:'🥇',t:'1º treino',ok:gym.length>=1},
    {e:'🏗️',t:'1 tonelada num treino',ok:maxVol>=1000},
    {e:'🔥',t:'Semana perfeita',ok:perfect},
    {e:'🦴',t:'5 blindagens',ok:shin>=5},
    {e:'⚽',t:'10 jogos',ok:soccer>=10},
    {e:'📉',t:'-2 kg',ok:lost>=2},
    {e:'⚖️',t:'-4 kg',ok:lost>=4},
    {e:'🏆',t:'PROJETO '+p.goalWeight,ok:currentWeight()<=p.goalWeight},
  ];
}

function confetti(){
  try{
    const cv=document.createElement('canvas');
    cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99';
    cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
    const ctx=cv.getContext('2d'); const cols=['#e52a33','#f5b83d','#34c778','#4da3ff','#ffffff'];
    const P=Array.from({length:130},(_,i)=>({x:cv.width/2,y:cv.height*0.35,vx:(Math.random()-0.5)*10,vy:Math.random()*-10-3,s:Math.random()*5+3,c:cols[i%5],r:Math.random()*6.28,vr:(Math.random()-.5)*.3}));
    let t=0;(function f(){ t++; ctx.clearRect(0,0,cv.width,cv.height);
      P.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.28;q.r+=q.vr;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-q.s/2,-q.s/2,q.s,q.s*0.6);ctx.restore();});
      if(t<110)requestAnimationFrame(f); else cv.remove(); })();
  }catch(e){}
}

function weekStats(){
  const now=new Date(); const day=(now.getDay()+6)%7; // seg=0
  const mon=new Date(now); mon.setDate(now.getDate()-day); mon.setHours(0,0,0,0);
  const list = S.sessions.filter(s=>new Date(s.date+'T12:00')>=mon);
  const vol = list.reduce((a,s)=>a+(s.volume||0),0);
  return {count:list.length, vol};
}
function streak(){
  // dias seguidos (semanas) com pelo menos 1 sessão — simplificado: sequência de dias com sessão ou descanso planejado
  const dates=new Set(S.sessions.map(s=>s.date));
  let n=0; const d=new Date();
  for(let i=0;i<60;i++){ const iso=d.toISOString().slice(0,10); if(dates.has(iso)) n++; d.setDate(d.getDate()-1); }
  return n;
}
function todayPlanItem(){
  const d=new Date().getDay(); const it=S.plan.schedule[d]||{type:'rest'};
  return it;
}
function schedLabel(it){
  if(it.type==='gym'){ const w=S.plan.workouts[it.wid]; return {ic:w.emoji, t:w.name, s:w.desc}; }
  if(it.type==='soccer') return {ic:'⚽', t:'Futebol', s:'Jogo conta como cardio intenso — faça a Blindagem da Canela depois'};

  return {ic:'😴', t:'Descanso', s:'Recuperação também é treino. Foque em sono e proteína.'};
}

        sets: Array.from({length:e.sets},()=>({kg:'',reps:'',done:false})) })) };

function lastPerf(exId){
  for(let i=S.sessions.length-1;i>=0;i--){ const s=S.sessions[i]; if(s.type==='cardio')continue;
    const e=(s.exercises||[]).find(x=>x.exId===exId); if(e){ return e.sets.filter(t=>t.done); } }
  return null;
}
function bestKg(exId){
  let best=0;
  S.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{ if(e.exId===exId) e.sets.forEach(t=>{ if(t.done&&+t.kg>best)best=+t.kg; }); }));
  return best;
}
function coachFor(e){
  if(!e.reps) return null;
  const m=/^(\d+)\s*-\s*(\d+)$/.exec(String(e.reps).trim());
  if(!m) return null;
  const top=+m[2];
  const prev=lastPerf(e.exId);
  if(!prev||!prev.length) return {type:'start',msg:'Coach: primeira vez neste exercício — comece leve e capriche na técnica.'};
  const kg=Math.max(...prev.map(s=>+s.kg||0));
  if(!(kg>0)) return null;
  const hitAll = prev.length>=e.planned && prev.every(s=>(+s.reps||0)>=top);
  if(hitAll){ const nk=Math.round((kg+2.5)*10)/10;
    return {type:'up',kg:nk,msg:`Coach: você fechou todas as séries com ${top}+ reps. Sobe pra <b>${nk} kg</b> hoje!`}; }
  return {type:'hold',msg:`Coach: mantenha <b>${kg} kg</b> e busque ${top} reps em todas as séries.`};
}
window.applyCoach=(ei,kg)=>{ S.activeSession.exercises[ei].sets.forEach(s=>{ if(!s.done) s.kg=kg; }); save(); renderSession(); };
function renderSession(){
  const a=S.activeSession;

  $('#view').innerHTML = `

    <button class="btn sm grn" onclick="finishSession()">Concluir ✓</button>
  </div>
  ${a.exercises.map((e,ei)=>{ const prev=lastPerf(e.exId); const ex=EXDB[e.exId];
    return `<div class="sess-ex fade-in">
    <h4>${esc(e.name)}</h4>

    <div class="cue">💡 ${ex?ex.cue:''}</div>
    ${(()=>{ const c=coachFor(e); return c?`<div class="coach">🤖 <span>${c.msg}</span>${c.type==='up'?`<button onclick="applyCoach(${ei},${c.kg})">Aplicar</button>`:''}</div>`:''; })()}
    <table class="sets"><tr><th>Série</th><th>Anterior</th><th>kg</th><th>Reps</th><th></th></tr>
    ${e.sets.map((st,si)=>{ const pv=prev&&prev[si]?`${prev[si].kg||'—'}×${prev[si].reps||'—'}`:'—';
      return `<tr class="${st.done?'done':''}">
      <td class="sn">${si+1}</td><td class="prev">${pv}</td>
      <td><input type="number" inputmode="decimal" step="0.5" value="${st.kg}" placeholder="${prev&&prev[si]?prev[si].kg:'kg'}" onchange="setVal(${ei},${si},'kg',this.value)"></td>
      <td><input type="number" inputmode="numeric" value="${st.reps}" placeholder="${prev&&prev[si]?prev[si].reps:'reps'}" onchange="setVal(${ei},${si},'reps',this.value)"></td>
      <td><button class="ck ${st.done?'on':''}" onclick="toggleSet(${ei},${si})">✓</button></td></tr>`; }).join('')}
    </table>
    <button class="addset" onclick="addSet(${ei})">+ adicionar série</button>
  </div>`; }).join('')}
  <button class="btn grn" onclick="finishSession()">Concluir treino ✓</button>`;
  clearInterval(sessTick);
  const upd=()=>{ const el=$('#sess-clock'); if(!el){clearInterval(sessTick);return;}
    el.textContent='⏱ '+fmtClock(Math.floor((Date.now()-a.startedAt)/1000)); };
  upd(); sessTick=setInterval(upd,1000);
}
window.setVal=(ei,si,k,v)=>{ S.activeSession.exercises[ei].sets[si][k]=v; save(); };
window.toggleSet=(ei,si)=>{
  const e=S.activeSession.exercises[ei]; const st=e.sets[si];
  if(!st.done){
    // autocompleta com placeholder (último treino) se vazio
    const prev=lastPerf(e.exId);
    if(st.kg===''&&prev&&prev[si]) st.kg=prev[si].kg;
    if(st.reps===''&&prev&&prev[si]) st.reps=prev[si].reps;
    st.done=true;
    if(navigator.vibrate) navigator.vibrate(30);
    const info = si+1 < e.sets.length
      ? `Próxima: série ${si+2} de ${e.sets.length} — ${esc(e.name)}`
      : `${esc(e.name)} concluído — próximo exercício! 🔥`;
    startRest(e.rest, info);
  } else st.done=false;
  save(); renderSession();
};
window.addSet=(ei)=>{ S.activeSession.exercises[ei].sets.push({kg:'',reps:'',done:false}); save(); renderSession(); };
window.cancelSession=()=>{ if(confirm('Descartar este treino? Nada será salvo.')){ S.activeSession=null; save(); timerStop(); releaseWake(); go('treino'); } };
window.finishSession=()=>{
  const a=S.activeSession;
  const done=a.exercises.map(e=>({exId:e.exId,name:e.name,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  if(!done.length){ alert('Marque pelo menos uma série feita (✓) antes de concluir.'); return; }
  // PRs (antes de salvar a sessão)
  const prs=[];
  done.forEach(e=>{ const prevBest=bestKg(e.exId);
    e.sets.forEach(s=>{ if(+s.kg>prevBest && +s.kg>0 && !prs.includes(e.name)) prs.push(e.name); }); });
  const vol=done.reduce((t,e)=>t+e.sets.reduce((v,s)=>v+((+s.kg||0)*(+s.reps||0)),0),0);
  const dur=Math.max(1,Math.round((Date.now()-a.startedAt)/60000));
  S.sessions.push({ id:Date.now(), type:'gym', workoutId:a.workoutId, name:a.name, emoji:a.emoji,
    date:todayISO(), durationMin:dur, exercises:done, volume:Math.round(vol) });
  S.activeSession=null; save(); timerStop(); clearInterval(sessTick); releaseWake();
  confetti();
  openModal(`<h2>Treino concluído! 🎉</h2>
    <div class="grid2" style="margin-bottom:14px">
      <div class="stat"><div class="v">${dur}min</div><div class="k">duração</div></div>
      <div class="stat"><div class="v">${(vol/1000).toFixed(2)}t</div><div class="k">volume total</div></div>
    </div>
    ${prs.length?`<div class="card" style="border-color:var(--yel)"><h3>🏆 Novos recordes!</h3><div class="note">${prs.map(esc).join(' · ')}</div></div>`:''}
    <button class="btn" onclick="closeModal();go('prog')">Ver progresso 📈</button>`);
};

let timerInt=null, timerLeft=0, timerTotal=0, timerInfo='';
const REST_R=108, REST_C=2*Math.PI*REST_R;
function buildRestOverlay(){
  $('#restfull').innerHTML = `
    <div class="rl">Descanso</div>
    <div class="ringbig">
      <svg width="230" height="230" viewBox="0 0 230 230">
        <circle cx="115" cy="115" r="${REST_R}" fill="none" stroke="#26262e" stroke-width="10"/>
        <circle id="rf-arc" cx="115" cy="115" r="${REST_R}" fill="none" stroke="var(--red)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${REST_C}" stroke-dashoffset="0"/>
      </svg>
      <div class="rt" id="rf-time">0:00</div>
    </div>
    <div class="ri">${timerInfo}</div>
    <div class="rbtns"><button class="btn sm ghost" onclick="timerAdd(30)">+30s</button><button class="btn sm" onclick="timerStop()">Pular ▶</button></div>
    <button class="min" onclick="minimizeRest()">▾ minimizar (continua contando)</button>`;
}
function tickTimer(){
  const t=Math.max(0,timerLeft);
  const tv=$('#timer-val'); if(tv) tv.textContent=fmtClock(t);
  const rt=$('#rf-time'); if(rt) rt.textContent=fmtClock(t);
  const arc=$('#rf-arc'); if(arc) arc.setAttribute('stroke-dashoffset', String(REST_C*(1-(timerTotal? t/timerTotal : 0))));
}
function startRest(sec, info){
  timerLeft=sec; timerTotal=sec; timerInfo=info||'';
  $('#timerbar').classList.add('hidden');
  $('#restfull').classList.remove('hidden');
  buildRestOverlay(); tickTimer();
  clearInterval(timerInt);
  timerInt=setInterval(()=>{ timerLeft--; tickTimer();
    if(timerLeft<=0){ timerStop(); beep(); } },1000);
}
window.minimizeRest=()=>{ $('#restfull').classList.add('hidden'); $('#timerbar').classList.remove('hidden'); tickTimer(); };
window.expandRest=()=>{ if(timerLeft>0){ $('#timerbar').classList.add('hidden'); $('#restfull').classList.remove('hidden'); buildRestOverlay(); tickTimer(); } };
window.timerAdd=s=>{ timerLeft+=s; timerTotal=Math.max(timerTotal,timerLeft); tickTimer(); };
window.timerStop=()=>{ clearInterval(timerInt); timerLeft=0; $('#timerbar').classList.add('hidden'); $('#restfull').classList.add('hidden'); };
function beep(){
  try{ const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach((t,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value=i===2?1180:880; o.type='sine';
      g.gain.setValueAtTime(0.25,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.15);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.16); });
    if(navigator.vibrate)navigator.vibrate([120,60,120]);
  }catch(e){}
}

function weightChart(){
  const p=S.profile;
  const pts=S.weights;
  const W_=340,H_=190,pad={l:34,r:10,t:12,b:22};
  const x0=new Date(p.createdAt||pts[0].date), x1=new Date(p.goalDate);
  const span=Math.max(1,(x1-x0));
  const allKg=pts.map(w=>w.kg).concat([p.goalWeight,p.weight0]);
  const yMin=Math.floor(Math.min(...allKg))-1, yMax=Math.ceil(Math.max(...allKg))+1;
  const X=d=>pad.l+((new Date(d)-x0)/span)*(W_-pad.l-pad.r);
  const Y=v=>pad.t+(1-(v-yMin)/(yMax-yMin))*(H_-pad.t-pad.b);
  const line=pts.map((w,i)=>(i?'L':'M')+X(w.date).toFixed(1)+' '+Y(w.kg).toFixed(1)).join(' ');
  const ma = pts.length>=3 ? pts.map(w=>{ const t=new Date(w.date+'T12:00');
    const win=pts.filter(x=>{ const u=new Date(x.date+'T12:00'); return u<=t && (t-u)<=6.5*86400000; });
    return {date:w.date, kg:win.reduce((acc,x)=>acc+x.kg,0)/win.length}; }) : null;
  const maLine = ma ? ma.map((w,i)=>(i?'L':'M')+X(w.date).toFixed(1)+' '+Y(w.kg).toFixed(1)).join(' ') : '';
  const gridY=[]; for(let v=yMin;v<=yMax;v+=(yMax-yMin>8?2:1)) gridY.push(v);
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W_} ${H_}">
    ${gridY.map(v=>`<line x1="${pad.l}" x2="${W_-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#26262e" stroke-width="1"/>
      <text x="${pad.l-6}" y="${Y(v)+3}" fill="#6b6b78" font-size="8" text-anchor="end">${v}</text>`).join('')}
    <line x1="${X(p.createdAt||pts[0].date)}" y1="${Y(p.weight0)}" x2="${X(p.goalDate)}" y2="${Y(p.goalWeight)}" stroke="#34c778" stroke-width="1.5" stroke-dasharray="4 4" opacity=".8"/>
    <text x="${W_-pad.r}" y="${Y(p.goalWeight)-5}" fill="#34c778" font-size="8" text-anchor="end">meta ${p.goalWeight}kg · ${fmtDate(p.goalDate)}</text>
    ${maLine?`<path d="${maLine}" fill="none" stroke="#f2f2f4" stroke-width="1.5" stroke-dasharray="2 3" opacity=".5"/>`:''}
    ${line?`<path d="${line}" fill="none" stroke="#e52a33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}
    ${pts.map(w=>`<circle cx="${X(w.date)}" cy="${Y(w.kg)}" r="3.4" fill="#0c0c0e" stroke="#ff4d55" stroke-width="2"/>`).join('')}
    ${pts.length?`<text x="${Math.min(W_-pad.r-2,X(pts[pts.length-1].date)+4)}" y="${Y(pts[pts.length-1].kg)-8}" fill="#f2f2f4" font-size="9" font-weight="700" text-anchor="end">${pts[pts.length-1].kg.toFixed(1)}kg</text>`:''}
  </svg></div>`;
}
function heatmapHTML(){
  const count={}; S.sessions.forEach(s=>{ count[s.date]=(count[s.date]||0)+1; });
  const today=new Date(); today.setHours(12,0,0,0);
  const dow=(today.getDay()+6)%7; // seg=0
  const end=new Date(today); end.setDate(end.getDate()+(6-dow));
  const start=new Date(end); start.setDate(end.getDate()-16*7+1);
  const cells=[];
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const iso=localISO(d); const n=count[iso]||0; const fut=d>today;
    cells.push(`<i class="${n>=2?'h3':n===1?'h2':''}"${fut?' style="opacity:.22"':''}></i>`);
  }
  return `<div class="hm">${cells.join('')}</div>`;
}
function shinChart(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-30);
  const pts=Object.keys(S.wellness).filter(d=>S.wellness[d].shin!=null && new Date(d+'T12:00')>=cutoff)
    .sort().map(d=>({date:d,v:+S.wellness[d].shin}));
  if(pts.length<2) return '<div class="note">Registre a dor na aba Início por alguns dias pra ver a evolução aqui.</div>';
  const W_=340,H_=110,pad={l:22,r:8,t:8,b:14};
  const x0=new Date(pts[0].date+'T12:00'), x1=new Date(pts[pts.length-1].date+'T12:00');
  const span=Math.max(1,x1-x0);
  const X=d=>pad.l+((new Date(d+'T12:00')-x0)/span)*(W_-pad.l-pad.r);
  const Y=v=>pad.t+(1-v/10)*(H_-pad.t-pad.b);
  const line=pts.map((q,i)=>(i?'L':'M')+X(q.date).toFixed(1)+' '+Y(q.v).toFixed(1)).join(' ');
  const half=Math.ceil(pts.length/2);
  const first=pts.slice(0,half).reduce((a,x)=>a+x.v,0)/half;
  const last=pts.slice(-half).reduce((a,x)=>a+x.v,0)/half;
  const trend = last<first-0.5?'📉 Dor caindo — a blindagem está funcionando, continua!':(last>first+0.5?'📈 Dor subindo — reduza o impacto esta semana e reavalie o tênis. Se persistir, ortopedista.':'➡️ Estável — mantenha a rotina de blindagem.');
  return `<svg class="chart" viewBox="0 0 ${W_} ${H_}">
    ${[0,5,10].map(v=>`<line x1="${pad.l}" x2="${W_-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#26262e"/><text x="${pad.l-5}" y="${Y(v)+3}" fill="#6b6b78" font-size="8" text-anchor="end">${v}</text>`).join('')}

  </svg><div class="note" style="margin-top:6px">${trend}</div>`;
}

  const row=(l,v,delta)=>`<div class="row" style="padding:5px 0"><div class="grow" style="font-size:.85rem">${l}</div><b style="font-variant-numeric:tabular-nums">${v}</b>&nbsp;${delta}</div>`;

  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.profile&&d.plan){ S=Object.assign(defState(),d); save(); go('home'); alert('Backup restaurado! ✅'); } else alert('Arquivo inválido.'); }catch(e){ alert('Arquivo inválido.'); } };
    r.readAsText(f); };
  inp.click();
};

// ---------- boot ----------
if('serviceWorker' in navigator && location.protocol==='https:'){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
if(S.profile && S.plan){
  $('#app').classList.remove('hidden');
  go(S.activeSession?'treino':'home');
}else{
  $('#onb').classList.remove('hidden');
  renderOnb();
}
</script>
</body>
</html>
